name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            archive: tar.gz
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: windows-latest
            rid: win-arm64
            archive: zip
          - os: macos-latest
            rid: osx-x64
            archive: tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish with runtime (${{ matrix.rid }})
        run: dotnet publish Etoile.Lite/Etoile.Lite.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish/${{ matrix.rid }}

      - name: Publish without runtime (${{ matrix.rid }})
        run: dotnet publish Etoile.Lite/Etoile.Lite.csproj -c Release -r ${{ matrix.rid }} --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish/${{ matrix.rid }}-noruntime

      - name: Package
        shell: pwsh
        run: |
          $name = "Etoile.Lite-${{ github.ref_name }}-${{ matrix.rid }}"
          if ("${{ matrix.archive }}" -eq "zip") {
            Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "$name.zip"
            Compress-Archive -Path "publish/${{ matrix.rid }}-noruntime/*" -DestinationPath "$name-noruntime.zip"
          } else {
            tar -czf "$name.tar.gz" -C "publish/${{ matrix.rid }}" .
            tar -czf "$name-noruntime.tar.gz" -C "publish/${{ matrix.rid }}-noruntime" .
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.rid }}
          path: |
            Etoile.Lite-${{ github.ref_name }}-${{ matrix.rid }}.zip
            Etoile.Lite-${{ github.ref_name }}-${{ matrix.rid }}-noruntime.zip
            Etoile.Lite-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz
            Etoile.Lite-${{ github.ref_name }}-${{ matrix.rid }}-noruntime.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
          else
            gh release create "$tag" artifacts/* --generate-notes
          fi
